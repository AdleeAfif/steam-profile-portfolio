name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: docker.io/adleeafif/steam-portfolio

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The runtime stage runs apk for the target architecture.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: adleeafif
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: [self-hosted, rpi5]
    env:
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
      - run: sed -i "s|^\(\s*newTag:\).*|\1 ${TAG}|" k8s/kustomization.yaml
      - name: Apply env secret and manifests
        env:
          ENV_FILE: ${{ secrets.ENV }}
        run: |
          [ -n "$ENV_FILE" ] || { echo "The ENV repository secret is empty"; exit 1; }
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > "$RUNNER_TEMP/app.env"
          kubectl create namespace steam-portfolio --dry-run=client -o yaml | kubectl apply -f -
          secret=$(kubectl -n steam-portfolio create secret generic steam-portfolio-env --from-env-file="$RUNNER_TEMP/app.env" --dry-run=client -o yaml | kubectl apply -f -)
          rm -f "$RUNNER_TEMP/app.env"
          echo "$secret"
          manifests=$(kubectl apply -k k8s)
          echo "$manifests"
          # envFrom is read only at pod start, so an env-only change needs a restart.
          if [[ $secret != *unchanged* && $manifests == *"deployment.apps/steam-portfolio unchanged"* ]]; then
            kubectl -n steam-portfolio rollout restart deployment/steam-portfolio
          fi
      - name: Wait for rollout, roll back on failure
        run: |
          if ! kubectl -n steam-portfolio rollout status deployment/steam-portfolio --timeout=180s; then
            kubectl -n steam-portfolio rollout undo deployment/steam-portfolio
            exit 1
          fi
