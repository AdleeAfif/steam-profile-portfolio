# Copy to k8s/secret.yaml (gitignored), fill in, then: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: steam-portfolio-env
  namespace: steam-portfolio
type: Opaque
stringData:
  PROFILE_API_URL: http://profile-api.profile-api.svc.cluster.local:8080
  PROFILE_API_ADMIN_URL: http://profile-api-admin.profile-api.svc.cluster.local:8081
  PROFILE_API_KEY: CHANGE_ME
  PROFILE_API_APP: steam-portfolio
  SITE_URL: https://adlee.my
  TRUST_CF_HEADERS: "true"
  PUBLIC_GA_ID: ""
